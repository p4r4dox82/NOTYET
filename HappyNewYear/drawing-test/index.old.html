<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js Embossing Drawing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            overflow: hidden; 
            background-color: #1a1a1a;
            width: 100vw;
            height: 100vh;
        }
        
        #container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        
        #left-panel {
            flex: 1;
            position: relative;
            background-color: #000;
        }
        
        #right-panel {
            flex: 1;
            position: relative;
        }
        
        canvas { 
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* 왼쪽 패널 캔버스 */
        #left-canvas {
            width: 100%;
            height: 100%;
        }
        
        /* 오버레이 그리기 캔버스 */
        #ui-canvas {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 256px;
            height: 256px;
            z-index: 10;
            cursor: crosshair;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        /* 왼쪽 패널 하단 버튼 */
        #apply-button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 12px 20px;
            background-color: rgba(255, 165, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 5;
        }
        
        #apply-button:hover {
            background-color: rgba(255, 165, 0, 1);
        }
        
        #apply-button:active {
            background-color: rgba(255, 140, 0, 1);
        }
        
        /* 슬라이더 컨트롤 패널 */
        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(255, 165, 0, 0.6);
            border-radius: 8px;
            padding: 20px;
            z-index: 100;
            min-width: 300px;
            max-width: 350px;
            font-family: 'Courier New', monospace;
            color: #fff;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: rgba(255, 165, 0, 0.9);
        }
        
        .control-value {
            color: #00ff00;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(100, 100, 100, 0.5);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 165, 0, 0.9);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.6);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 165, 0, 0.9);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.6);
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.131/build/three.module.js",
                "jsm/": "https://cdn.jsdelivr.net/npm/three@0.131/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- <canvas></canvas> -->
    <div id="container">
        <!-- 왼쪽: 평면 이미지 표시 -->
        <div id="left-panel">
            <canvas id="left-canvas"></canvas>
            <button id="apply-button">Apply Normal Map</button>
        </div>
        
        <!-- 오른쪽: 3D 큐브 표시 -->
        <div id="right-panel">
            <canvas id="right-canvas"></canvas>
        </div>
        
        <!-- 오버레이: 그리기 캔버스 (전체 화면) -->
        <canvas id="ui-canvas"></canvas>
        
        <!-- 노이즈 control 패널 -->
